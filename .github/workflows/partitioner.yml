name: Hardware-aware partitioner

on:
  workflow_dispatch:
  push:
    paths: ['scripts/partition/**', 'tools/**', 'doc/partition/**', 'packaging/partitioner/**', 'partitioner*', 'build.gradle', 'test/resources/partition/**', 'src/com/xilinx/rapidwright/edif/partition/**', 'test/src/com/xilinx/rapidwright/edif/partition/**', '.github/workflows/partitioner.yml']
  pull_request:
    paths: ['scripts/partition/**', 'tools/**', 'doc/partition/**', 'packaging/partitioner/**', 'partitioner*', 'build.gradle', 'test/resources/partition/**', 'src/com/xilinx/rapidwright/edif/partition/**', 'test/src/com/xilinx/rapidwright/edif/partition/**', '.github/workflows/partitioner.yml']

jobs:
  portable-python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install Tcl runtime on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk
      - name: Verify headless Tcl parser
        run: python -c "import tkinter; print(tkinter.Tcl().call('info', 'patchlevel'))"
      - name: Install pinned figure dependencies
        run: python -m pip install -r scripts/partition/requirements.txt
      - name: Frontend, topology, capacity and tool discovery tests
        run: python -m unittest discover -s scripts/partition -p 'test_*.py'
      - name: Independent native-reference helper tests
        run: python -m unittest discover -s tools -p 'test_*.py'
  java-partitioner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build and test self-contained partitioner fixtures
        run: ./gradlew compileJava testJava --tests 'com.xilinx.rapidwright.edif.partition.*' -x initSubmodules --console=plain
      - name: Build portable runtime bundle
        run: ./gradlew partitionerDistZip --console=plain
      - name: Upload runtime bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rapidwright-partitioner-extreme-overhaul
          path: |
            build/distributions/rapidwright-partitioner-extreme-overhaul.zip
            build/distributions/rapidwright-partitioner-extreme-overhaul.zip.sha256
          if-no-files-found: error
  validation-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Compile the standalone evidence report
        run: |
          mkdir -p build/partition-report
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build/partition-report doc/partition/VALIDATION_REPORT.tex
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build/partition-report doc/partition/VALIDATION_REPORT.tex
      - name: Upload compiled report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: partitioner-validation-report
          path: build/partition-report/VALIDATION_REPORT.pdf
          if-no-files-found: error
